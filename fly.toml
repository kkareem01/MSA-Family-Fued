# Fly.io: `fly launch --copy-config --no-deploy`, then `fly volumes create feud_data --size 1`,
# `fly secrets set HOST_PIN=... PUBLIC_URL=https://<app>.fly.dev`, `fly deploy`.
app = "msa-family-feud"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/feud.db"
  TRUST_PROXY = "true"

[[mounts]]
  source = "feud_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
